name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here needs write access.
permissions:
  contents: read

# A newer push to the same ref cancels the older run, so redundant work does not
# eat into the wall-time budget.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # All six release targets must compile. Cross-compilation on ubuntu runners is
  # far cheaper than native arm runners and asserts exactly what we need here:
  # that the code builds everywhere we ship.
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: amd64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
          - { goos: windows, goarch: arm64 }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Build
        run: bun ci
        run: bun run build

  # Tests run natively. The race detector is restricted to linux/amd64: it needs
  # cgo and a C toolchain, and running it on every leg buys no extra signal while
  # costing minutes.
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    # Mapped here because the `secrets` context is not available in a
    # step-level `if`, but `env` is.
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, race: true }
          - { os: macos-latest, race: false }
          - { os: windows-latest, race: false }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Format
        run: bun run format:check

      - name: Test
        if: ${{ !matrix.race }}
        run: bun test

      - name: Coverage summary
        if: ${{ matrix.race }}
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: true
