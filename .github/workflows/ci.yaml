name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here needs write access.
permissions:
  contents: read

# A newer push to the same ref cancels the older run, so redundant work does not
# eat into the wall-time budget.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Coverage is enabled by default via bunfig.toml (text + lcov reporters), so a plain
  # `bun test` already produces both — no extra flag or third-party service needed.
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # schemas/ is a symlink into the devcontainer-spec submodule — without this,
      # both tsc's text-import resolution and the schema tests' readdirSync see an
      # empty/missing directory.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      - run: bun test

      # One copy is enough; the lcov content doesn't vary by OS.
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/lcov.info

  # tsc is the correctness gate; prettier only checks formatting. Neither needs more
  # than one OS.
  check:
    name: typecheck & format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Same reason as the test job: tsc resolves schemas/*.schema.json through the
      # devcontainer-spec submodule symlink.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run format:check

  # Proves the compile step itself doesn't break on every PR, without paying for the
  # full 8-target release matrix (that's a separate, on-tag job).
  build-smoke:
    name: build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile
      - run: bun run build

      # dog-food: lint our own devcontainer.json with the binary just built
      - run: ./dist/dcx check

  # The extension in a real VS Code, under a virtual display. Linux only: the suite finds
  # the server process with pgrep, and one OS is enough for the editor side.
  vscode:
    name: vscode extension
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      # the pinned VS Code is the same download every run
      - uses: actions/cache@v6
        with:
          path: extensions/vscode/.vscode-test
          key: vscode-test-1.90.0

      - run: xvfb-run -a bun run test:e2e
        working-directory: extensions/vscode

  # Publishes the extension once main is green. Marketplace Trusted Publishing trusts this
  # workflow file in the marketplace environment, so there's no token to store or renew;
  # a merge that doesn't bump the version is a no-op.
  publish-vscode:
    name: publish vscode extension
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, check, build-smoke, vscode]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      # 4.1.0 is the first vsce with --oidc
      - run: |
          bun run build
          bunx @vscode/vsce@4.1.0 publish --oidc --no-dependencies --skip-license --skip-duplicate
        working-directory: extensions/vscode

  # Cuts GitHub Release vV when the root package.json version has no published release.
  # Each run checks for itself instead of diffing against the last commit, so a release a
  # cancelled run left half done gets finished by the next one.
  release:
    name: release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, check, build-smoke, vscode]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - id: v
        run: |
          V=$(bun -p 'require("./package.json").version')
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [ "$(gh release view "v$V" --json isDraft -q .isDraft 2>/dev/null)" = false ]; then
            echo "v$V is already released"
            echo "done=true" >> "$GITHUB_OUTPUT"
          fi

      # a draft a cancelled run left behind gets tagged at its own target when it's published,
      # so finish it from that commit, not whatever main is now
      - if: steps.v.outputs.done != 'true'
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          if target=$(gh release view "v$V" --json targetCommitish -q .targetCommitish 2>/dev/null); then
            git checkout "$target"
          fi

      - if: steps.v.outputs.done != 'true'
        run: |
          bun install --frozen-lockfile
          bun scripts/release.ts
          dist/release/dcx-linux-x64 --version
          dist/release/dcx-linux-x64 check

      # draft first, so a cancelled upload never leaves a public release missing binaries;
      # publishing the draft is what creates the tag
      - if: steps.v.outputs.done != 'true'
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$V" > /dev/null 2>&1; then
            gh release upload "v$V" --clobber dist/release/*
          else
            gh release create "v$V" --draft --target "$(git rev-parse HEAD)" --generate-notes dist/release/*
          fi
          gh release edit "v$V" --draft=false

  # npm trusted publishing trusts this workflow file in the npm environment; no token.
  publish-npm:
    name: publish npm package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    env:
      V: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      # Node only here: trusted publishing needs npm >= 11.5.1, and bun publish can't do OIDC
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@^11.5.1

      - run: |
          if [ "$(npm view "@craftbuild/dcx@$V" version 2>/dev/null)" = "$V" ]; then
            echo "@craftbuild/dcx@$V is already on npm"
            exit 0
          fi
          if ! err=$(npm view @craftbuild/dcx name 2>&1 > /dev/null); then
            case $err in
              *E404*) echo "@craftbuild/dcx is not on npm yet; first publish is by hand" && exit 0 ;;
              *) echo "$err" >&2 && exit 1 ;;
            esac
          fi
          npm publish
