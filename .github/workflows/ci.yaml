name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: nothing here needs write access.
permissions:
  contents: read

# A newer push to the same ref cancels the older run, so redundant work does not
# eat into the wall-time budget.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Coverage is enabled by default via bunfig.toml (text + lcov reporters), so a plain
  # `bun test` already produces both — no extra flag or third-party service needed.
  test:
    name: test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile

      - run: bun test

      # One copy is enough; the lcov content doesn't vary by OS.
      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  # tsc is the correctness gate; prettier only checks formatting. Neither needs more
  # than one OS.
  check:
    name: typecheck & format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile
      - run: bunx tsc --noEmit
      - run: bun run format:check

  # Proves the compile step itself doesn't break on every PR, without paying for the
  # full 8-target release matrix (that's a separate, on-tag job).
  build-smoke:
    name: build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - run: bun install --frozen-lockfile
      - run: bun run build
