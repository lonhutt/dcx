name: Schema drift

# schemas/ is a symlink into the pinned devcontainer-spec submodule, not a copy; so
# there's no local file to diff. What goes stale is the pin. This compares it against
# devcontainers/spec's main and opens an issue (with the bump steps) when they differ.
#
# An issue, not a PR: a PR opened with the default Actions token doesn't trigger CI, so
# the required checks on main would never report and it couldn't merge. Drift is rare
# enough that bumping by hand is fine.

on:
  schedule:
    - cron: "0 6 * * 1" # weekly, Monday 06:00 UTC
  workflow_dispatch:
    inputs:
      force:
        description: "Open the issue even if the pin is current (to test this workflow)"
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

jobs:
  check-drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Compare pinned commit against upstream main
        id: drift
        run: |
          pinned="$(git -C devcontainer-spec rev-parse HEAD)"
          upstream="$(git ls-remote https://github.com/devcontainers/spec.git refs/heads/main | cut -f1)"
          echo "pinned=$pinned" >> "$GITHUB_OUTPUT"
          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          if [ "$pinned" != "$upstream" ] || [ "${{ inputs.force }}" = "true" ]; then
            echo "drifted=true" >> "$GITHUB_OUTPUT"
          else
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          fi
          echo "pinned $pinned, upstream $upstream"

      # one open issue at a time; if it's still open, upstream moving again doesn't
      # change what has to be done
      - name: Open an issue
        if: steps.drift.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          PINNED: ${{ steps.drift.outputs.pinned }}
          UPSTREAM: ${{ steps.drift.outputs.upstream }}
          TITLE: devcontainer-spec pin is behind upstream
        run: |
          existing="$(gh issue list --state open --search "in:title \"$TITLE\"" --json number --jq '.[0].number')"
          if [ -n "$existing" ]; then
            echo "issue #$existing is already open"
            exit 0
          fi
          cat > body.md <<EOF
          \`devcontainers/spec\` main is at \`$UPSTREAM\`; the submodule is pinned at \`$PINNED\`.

          To bump:

          \`\`\`sh
          git -C devcontainer-spec fetch origin
          git -C devcontainer-spec checkout $UPSTREAM
          jq --arg c $UPSTREAM --arg d "\$(date -u +%Y-%m-%d)" \\
            'map_values(.commit = \$c | .retrieved = \$d | .url |= sub("/spec/[^/]+/schemas/"; "/spec/" + \$c + "/schemas/"))' \\
            src/schema/provenance.json > provenance.tmp && mv provenance.tmp src/schema/provenance.json
          bun run scripts/build-validators.ts
          bun test
          \`\`\`

          Look over the schema diff (\`git -C devcontainer-spec diff $PINNED $UPSTREAM -- schemas\`) before merging.
          EOF
          gh issue create --title "$TITLE" --body-file body.md
