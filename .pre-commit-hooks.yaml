# dcx as a pre-commit hook. In your .pre-commit-config.yaml:
#
#   - repo: https://github.com/lonhutt/dcx
#     rev: v0.1.0
#     hooks:
#       - id: dcx
- id: dcx
  name: dcx check
  description: Lint devcontainer.json
  # system, not node: the published bin is a Bun bundle, so pre-commit's nodeenv can't
  # run it; this uses the Bun already on the PATH. Bump the version with each release
  entry: bunx dcx@0.1.0 check
  language: system
  files: (^|/)\.?devcontainer\.json$
  pass_filenames: true
