# dcx as a pre-commit hook. In your .pre-commit-config.yaml:
#
#   - repo: https://github.com/lonhutt/dcx
#     rev: v0.1.0
#     hooks:
#       - id: dcx
- id: dcx
  name: dcx check
  description: Lint devcontainer.json
  # runs the release binary for whatever rev you pinned; no Bun needed
  entry: scripts/dcx.sh check
  language: script
  files: (^|/)\.?devcontainer\.json$
  pass_filenames: true
